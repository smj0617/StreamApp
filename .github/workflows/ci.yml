name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml에 고정한 버전·타깃·구성요소를 설치한다.
      - name: Rust 설치
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --features api/server,web/server -- -D warnings

      - name: test
        run: cargo test --workspace --features api/server,web/server

      - name: wasm 클라이언트 빌드
        run: cargo check -p web --target wasm32-unknown-unknown --no-default-features --features web
