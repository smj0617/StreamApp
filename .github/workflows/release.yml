# `v*` 태그를 푸시하면 서버 묶음(release-server.yml)과 데스크톱 설치 파일(release-desktop.yml)을 함께 만들고,
# GitHub Release를 한 번만 만들어 모든 파일을 올린다. (두 워크플로가 각자 릴리스를 만들면 같은 태그에서 경쟁한다.)
#
# 다운로드 페이지(packages/web/src/views/download.rs)는 releases/latest/download/<고정 파일 이름>으로 링크한다.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  server:
    uses: ./.github/workflows/release-server.yml

  desktop:
    uses: ./.github/workflows/release-desktop.yml

  release:
    name: GitHub Release
    needs: [server, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 실행 확인 화면(smoke-… 아티팩트)은 릴리스에 올리지 않는다.
      - run: |
          rm -f dist/*.png dist/*.txt
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
