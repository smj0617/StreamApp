# 로컬 오토스케일(과제 ⑤)의 컨테이너 이미지와 쿠버네티스 매니페스트가 깨지지 않았는지 확인한다.
# 이미지는 빌드만 하고 어디에도 올리지 않는다. Rust 릴리스 빌드라 오래 걸리므로 관련 파일이 바뀐 PR과 손으로만 돌린다.
name: Container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - k8s/**
      - loadtest/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/container.yml
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: 매니페스트 렌더링
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kustomize가 secretGenerator로 읽는 파일. 실제 클러스터에서는 scripts/k8s-up.ps1이 같은 방법으로 만든다.
      - name: 예시 비밀 값 복사
        run: cp k8s/app/secret.env.example k8s/app/secret.env
      - name: kubectl kustomize
        run: |
          kubectl kustomize k8s/app > /tmp/app.yaml
          kubectl kustomize k8s/metrics-server > /tmp/metrics-server.yaml
          grep -c '^kind:' /tmp/app.yaml /tmp/metrics-server.yaml
          grep -q -- '--kubelet-insecure-tls' /tmp/metrics-server.yaml

  image:
    name: 이미지 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: streamapp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
