[workspace]
resolver = "2"
# web: 화면·라우팅·실행 파일 / api: 서버 함수·DB·앱 서비스
members = ["packages/web", "packages/api"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
dioxus = { version = "=0.7.10" }
api = { path = "packages/api" }
serde = { version = "1", features = ["derive"] }

# 비밀번호 해시(Argon2)는 최적화 없이 돌리면 한 번에 1초 넘게 걸려 개발 실행과 테스트가 느려진다.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
