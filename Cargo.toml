[workspace]
resolver = "2"
# web: ?붾㈃쨌?쇱슦?끒룹떎???뚯씪 / api: ?쒕쾭 ?⑥닔쨌DB쨌???쒕퉬??
members = ["packages/web", "packages/api", "packages/desktop"]

[workspace.package]
version = "0.6.1"
edition = "2021"

[workspace.dependencies]
dioxus = { version = "=0.7.10" }
api = { path = "packages/api" }
serde = { version = "1", features = ["derive"] }

