# StreamApp 로컬 개발용 MediaMTX v1.21.3 설정. scripts\dev.ps1이 이 파일로 MediaMTX를 띄운다.
#
# - 적지 않은 키는 MediaMTX 기본값을 쓴다. 키 설명은 v1.21.3 기본 설정 파일을 본다:
#   https://github.com/bluenviron/mediamtx/blob/v1.21.3/mediamtx.yml
# - 환경 변수 MTX_<대문자 키>가 이 파일의 값을 덮어쓴다(리스트는 쉼표로 구분).
#   dev.ps1은 앱 포트(-Port)에 맞춰 MTX_AUTHHTTPADDRESS, MTX_HLSALLOWORIGINS와
#   훅 명령(MTX_PATHDEFAULTS_RUNONAVAILABLE, MTX_PATHDEFAULTS_RUNONUNAVAILABLE)을 정해 띄운다.
# - 실행 중에 이 파일을 고치면 MediaMTX가 다시 읽는다.
# - 검사: .tools\mediamtx-v1.21.3\mediamtx.exe --validate-conf=tools\mediamtx\mediamtx.yml

logLevel: info

###############################################
# 인증: 송출 키 확인은 앱이 한다(ADR 0002).
# MediaMTX는 동작마다 authHTTPAddress로 JSON(action, path, query 등)을 POST하고, 2xx면 허용한다.
authMethod: http
# localhost 대신 127.0.0.1: dx serve는 127.0.0.1에만 바인드하고, Windows에서 localhost는 ::1로 먼저 풀릴 수 있다.
# 경로는 Rust 상수 api::mediamtx::AUTH_PATH와 같아야 한다.
authHTTPAddress: http://127.0.0.1:8080/internal/mediamtx/auth
authHTTPExclude:
  # 필수: 앱이 시작할 때 부르는 Control API 요청이 다시 앱의 인증으로 돌아오지 않게 한다.
  - action: api
  - action: metrics
  - action: pprof
  # 시청은 누구나 할 수 있으므로 앱에 묻지 않는다(앱도 허용한다). HLS 요청마다 앱을 부르지 않고,
  # 앱이 다시 빌드되는 동안에도 재생이 끊기지 않는다.
  - action: read
  - action: playback

###############################################
# Control API: 앱이 지금 송출 중인 경로를 조회한다.
api: true
# 포트는 Rust 상수 api::server::mediamtx_api::DEFAULT_ADDRESS와 같아야 한다.
apiAddress: :9997

###############################################
# RTMP: OBS·ffmpeg 송출. 주소는 rtmp://localhost/<채널ID>?key=<송출 키>
rtmp: true
rtmpAddress: :1935

###############################################
# HLS: 브라우저 재생. 주소는 http://localhost:8888/<채널ID>/index.m3u8
hls: true
# 포트는 Rust 상수 api::mediamtx::HLS_BASE_URL(시청 페이지가 쓰는 재생 주소의 앞부분)과 같아야 한다.
hlsAddress: :8888
# 앱의 출처. localhost와 127.0.0.1은 서로 다른 출처라 둘 다 적는다.
hlsAllowOrigins: ['http://localhost:8080', 'http://127.0.0.1:8080']
# 송출이 시작되면 바로 HLS를 만든다(첫 재생 요청의 지연과 404를 없앤다).
hlsAlwaysRemux: true

###############################################
# WebRTC: 휴대폰 브라우저 송출(WHIP). 휴대폰은 앱의 휴대폰 방송 페이지에서 앱으로 WHIP 요청을 보내고,
# 앱이 현재 사용자의 채널 ID와 송출 키를 붙여 http://127.0.0.1:8889/<채널ID>/whip?key=<송출 키>로 넘긴다(ADR 0004).
# 영상·소리는 휴대폰이 아래 ICE 포트(8189)로 PC에 직접 보낸다. 휴대폰과 PC가 같은 와이파이에 있어야 한다.
webrtc: true
# 포트는 Rust 상수 api::mediamtx::WEBRTC_BASE_URL과 같아야 한다.
webrtcAddress: :8889
# ICE(영상·소리) 포트. UDP가 막힌 망을 위해 TCP도 같은 번호로 연다. Windows 방화벽에서 mediamtx.exe를 허용해야 한다.
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189

###############################################
# 쓰지 않는 서버는 끈다(포트 충돌과 방화벽 팝업을 줄인다).
rtsp: false
srt: false
moq: false

###############################################
# 경로 기본값(모든 경로에 적용): 송출 시작·종료를 앱에 알려 라이브를 열고 닫게 한다.
# - 경로가 준비되면(송출 시작) runOnAvailable, 준비가 끝나면(송출 종료) runOnUnavailable을 실행한다.
#   v1.19.3부터 runOnReady/runOnNotReady는 이 이름으로 바뀌었다.
# - Windows에서는 셸 없이 실행한다: 내장 curl.exe를 이름으로 부르고(백슬래시가 든 경로는 쓰지 않는다),
#   $MTX_PATH(경로 이름 = 채널 ID)는 MediaMTX가 직접 바꿔 넣는다. 본문 없이 POST한다.
# - 앱 주소는 dev.ps1이 앱 포트에 맞춰 MTX_PATHDEFAULTS_RUNONAVAILABLE, MTX_PATHDEFAULTS_RUNONUNAVAILABLE로 덮어쓴다.
# - 훅 호출이 실패해도(앱이 다시 빌드되는 중 등) MediaMTX는 다시 시도하지 않는다.
# - 경로는 Rust 상수 api::mediamtx::AVAILABLE_HOOK_PATH, api::mediamtx::UNAVAILABLE_HOOK_PATH와 같아야 한다.
pathDefaults:
  # 이미 송출 중인 채널에 두 번째 송출(다른 휴대폰, OBS 등)이 오면 기존 송출을 끊지 않고 새 송출을 거절한다.
  # 기본값(true)이면 나중에 온 쪽이 방송 중인 쪽을 밀어낸다. 거절된 휴대폰 방송은 앱이 409와 사유로 알린다.
  overridePublisher: false
  runOnAvailable: curl.exe -s -X POST http://127.0.0.1:8080/internal/mediamtx/hooks/available?path=$MTX_PATH
  runOnAvailableRestart: false
  runOnUnavailable: curl.exe -s -X POST http://127.0.0.1:8080/internal/mediamtx/hooks/unavailable?path=$MTX_PATH

###############################################
# 경로: all_others가 있어야 아무 경로(채널 ID)로나 송출할 수 있다. 누가 송출할 수 있는지는 인증이 정한다.
paths:
  all_others:
