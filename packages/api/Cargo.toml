[package]
name = "api"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
serde = { workspace = true }

# ---- 서버 전용: `server` feature로만 켠다. 웹(wasm) 빌드에 들어가면 안 된다. ----
sqlx = { version = "=0.8.6", features = ["runtime-tokio", "sqlite"], optional = true }
rand = { version = "0.9", optional = true }
thiserror = { version = "2", optional = true }
anyhow = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
# MediaMTX 연동 엔드포인트(`mediamtx` 모듈). dioxus가 쓰는 axum 0.8과 같은 크레이트로 합쳐진다.
axum = { version = "0.8", features = ["multipart"], optional = true }
form_urlencoded = { version = "1", optional = true }
# 앱 시작 시 MediaMTX Control API 조회(`server::mediamtx_api`)와 토스페이먼츠 결제 승인·조회(`server::toss_payments`, HTTPS).
# dioxus-fullstack이 쓰는 reqwest 0.12(rustls-tls 포함)와 합쳐진다.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# 채팅: 채널별 broadcast(`service::chat`)와 채팅 WebSocket 어댑터의 `select!`. dioxus 서버가 쓰는 tokio와 합쳐진다.
# 비밀번호 해시는 `spawn_blocking`(rt)으로 비동기 작업 스레드 밖에서 계산한다.
tokio = { version = "1", features = ["sync", "macros", "fs", "io-util", "rt"], optional = true }
# 녹화방송 영상 파일: 받은 조각을 파일로 쓰고(`service::recordings`), 폴더의 파일을 Range 요청까지 받아 내준다
# (`recording_files`). 모두 dioxus 서버가 이미 쓰는 크레이트와 합쳐진다.
tower-http = { version = "0.6", features = ["fs"], optional = true }
futures-util = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
# 로그인(과제 ③): 비밀번호는 Argon2id로 해시해 저장하고, 세션 토큰은 SHA-256 값만 DB에 남긴다.
argon2 = { version = "0.5", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
# 이름을 바꾸면 안 된다: 서버 함수 매크로가 `feature = "server"`를 전제로 코드를 만든다.
server = [
    "dioxus/server",
    "dep:sqlx",
    "dep:rand",
    "dep:thiserror",
    "dep:anyhow",
    "dep:tracing",
    "dep:axum",
    "dep:form_urlencoded",
    "dep:reqwest",
    "dep:tokio",
    "dep:tower-http",
    "dep:futures-util",
    "dep:bytes",
    "dep:argon2",
    "dep:sha2",
]

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt", "time", "net"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
futures-util = "0.3"
bytes = "1"

# `server` feature 없이 `cargo test -p api`를 돌리면 건너뛴다.
[[test]]
name = "service"
path = "tests/service.rs"
required-features = ["server"]

[[test]]
name = "mediamtx_http"
path = "tests/mediamtx_http.rs"
required-features = ["server"]

[[test]]
name = "watch_page"
path = "tests/watch_page.rs"
required-features = ["server"]

[[test]]
name = "chat"
path = "tests/chat.rs"
required-features = ["server"]

[[test]]
name = "recordings"
path = "tests/recordings.rs"
required-features = ["server"]

[[test]]
name = "recording_http"
path = "tests/recording_http.rs"
required-features = ["server"]

[[test]]
name = "whip_http"
path = "tests/whip_http.rs"
required-features = ["server"]

[[test]]
name = "auth"
path = "tests/auth.rs"
required-features = ["server"]

[[test]]
name = "comments"
path = "tests/comments.rs"
required-features = ["server"]

[[test]]
name = "donations"
path = "tests/donations.rs"
required-features = ["server"]

[[test]]
name = "payments_http"
path = "tests/payments_http.rs"
required-features = ["server"]
